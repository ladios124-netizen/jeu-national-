<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Nation à la Roue & Tournoi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0d;
            color: #fffffe;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .card {
            background-color: #16161a;
            border-radius: 16px;
            padding: 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #242429;
            margin-bottom: 20px;
        }

        .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn {
            flex: 1; padding: 10px; background: #242429; border: 1px solid #333;
            color: #94a1b2; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .mode-btn.active { background: #7f5af0; color: white; border-color: #7f5af0; }

        .wheel-box {
            background: #242429;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .wheel-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f5af0;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #fffffe;
            transition: transform 2.5s cubic-bezier(0.15, 0.99, 0.18, 1);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #e63946;
            z-index: 10;
        }

        canvas#flagCanvas {
            width: 100%;
            height: 140px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            border: 1px solid #333;
            background: #111;
        }

        .grid-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; text-align: left;
        }
        .info-group { background: #242429; padding: 8px 12px; border-radius: 6px; }
        .info-group.full { grid-column: span 2; }
        .label { font-size: 0.65rem; color: #94a1b2; text-transform: uppercase; font-weight: 600; }
        .value { font-size: 0.9rem; font-weight: bold; color: #fffffe; margin-top: 2px; }

        .lore-box {
            background: #111116; border: 1px solid #333; border-radius: 8px; padding: 10px;
            font-size: 0.8rem; color: #d1d5db; line-height: 1.4; text-align: left; margin-top: 5px;
        }

        .btn-group { display: flex; gap: 10px; }
        button.btn-act {
            flex: 1; background-color: #7f5af0; color: white; border: none; padding: 12px;
            font-size: 0.95rem; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        button.btn-act:disabled { background-color: #444; cursor: not-allowed; }
        button.btn-auto { background-color: #2cb67d; }

        .tournament-list { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 15px; }
        .country-card { background: #242429; padding: 12px; border-radius: 8px; border-left: 4px solid #7f5af0; font-size: 0.85rem;}
        .ai-analysis { margin-top: 6px; background: #1a1a24; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; border: 1px dashed #7f5af0; }
        
        .log-box {
            background: #000; color: #00ff66; font-family: monospace; padding: 10px;
            border-radius: 8px; max-height: 250px; overflow-y: auto; text-align: left; font-size: 0.8rem;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <div class="mode-selector">
            <button id="btnModeNormal" class="mode-btn active" onclick="switchMode('normal')">Mode Normal</button>
            <button id="btnModeTournament" class="mode-btn" onclick="switchMode('tournament')">Mode Tournoi 🏆</button>
        </div>

        <div class="wheel-box">
            <div id="wheelTitle" class="wheel-title">Tourner pour : Superficie</div>
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel" width="200" height="200"></canvas>
            </div>
        </div>

        <div id="normalView">
            <canvas id="flagCanvas" width="300" height="150"></canvas>

            <div class="grid-stats">
                <div class="info-group"><div class="label">Superficie</div><div class="value" id="c-area">-</div></div>
                <div class="info-group"><div class="label">Population</div><div class="value" id="c-pop">-</div></div>
                <div class="info-group"><div class="label">Armée (Taille)</div><div class="value" id="c-army" style="color:#e63946;">-</div></div>
                <div class="info-group"><div class="label">IDH</div><div class="value" id="c-hdi">-</div></div>
                <div class="info-group"><div class="label">PIB / hab.</div><div class="value" id="c-gdp-cap">-</div></div>
                <div class="info-group"><div class="label">PIB Total</div><div class="value" id="c-gdp-total">-</div></div>
                <div class="info-group"><div class="label">Parti Politique</div><div class="value" id="c-party">-</div></div>
                <div class="info-group"><div class="label">Leader Historique</div><div class="value" id="c-leader">-</div></div>
                <div class="info-group full"><div class="label">Culture</div><div class="value" id="c-culture">-</div></div>
                
                <div class="info-group"><div class="label">Pays Historique Similaire</div><div class="value" id="c-sim-hist" style="color:#f4a261;">-</div></div>
                <div class="info-group"><div class="label">Pays Actuel Similaire</div><div class="value" id="c-sim-curr" style="color:#2a9d8f;">-</div></div>

                <div class="info-group full" style="border: 1px solid #7f5af0;">
                    <div class="label" style="color: #7f5af0;">Nom de la Nation (Final)</div>
                    <div class="value" id="c-name" style="font-size: 1.2rem; color: #2cb67d;">???</div>
                </div>

                <div class="info-group full hidden" id="loreGroup">
                    <div class="label" style="color:#2cb67d;">📜 Contexte Historique & Comparaisons (IA)</div>
                    <div class="lore-box" id="c-lore"></div>
                </div>
            </div>
            
            <div class="btn-group">
                <button id="btnSpin" class="btn-act" onclick="spinNextStep()">Tourner la Roue !</button>
                <button id="btnFullAuto" class="btn-act btn-auto" onclick="generateAllWithWheelAnimation()">⚡ Tout Tirer</button>
            </div>
        </div>

        <div id="tournamentView" class="hidden">
            <button id="btnGenTournament" class="btn-act" style="width: 100%; margin-bottom: 15px;" onclick="startTournamentGen()">Générer 5 Pays via la Roue 🎡</button>
            <div id="tournamentCountries" class="tournament-list"></div>
            <button id="btnWar" class="btn-act hidden" style="width: 100%; background-color: #e63946;" onclick="simulateWar()">Lancer la Guerre ! ⚔️</button>
            <div id="warLogs" class="log-box hidden" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        const prefixes = ["Val", "Ar", "Bel", "Kael", "Nov", "Zor", "Ond", "Eld", "Mar", "Sol", "Vanguard", "Aethel"];
        const suffixes = ["ia", "is", "oria", "gard", "onia", "vane", "terra", "mire", "stan", "dor"];

        // Génération dynamique des 20 catégories de population (100k -> 1M, pas de 100k ... puis montée progressive)
        const popCategories = [];
        for (let i = 1; i <= 20; i++) {
            let val = i * 100000;
            if (i > 10) val = (i - 9) * 100000000; // Passage aux échelles supérieures jusqu'à 1Milliard
            popCategories.push(val);
        }

        const politicalData = [
            { 
                party: "Fascisme / Nazisme", 
                leaders: ["Adolf Hitler", "Benito Mussolini", "Philippe Pétain", "Francisco Franco", "Oswald Mosley", "Ante Pavelić", "Miklos Horthy", "Ion Antonescu"], 
                culture: "Militarisme Radical", symbol: "fasces", bgColors: ["#800000", "#111111", "#dddddd"],
                histCountries: ["Allemagne Nazie", "Italie Fasciste", "Régime de Vichy", "Espagne Franquiste"],
                currCountries: ["Corée du Nord", "Érythrée", "Syrie (Régime Baas)"]
            },
            { 
                party: "Communisme", 
                leaders: ["Vladimir Lénine", "Joseph Staline", "Mao Zedong", "Fidel Castro", "Ho Chi Minh", "Josip Broz Tito", "Enver Hoxha", "Thomas Sankara"], 
                culture: "Collectivisme d'État", symbol: "hammer_sickle", bgColors: ["#cc0000", "#dd0000", "#ffcc00"],
                histCountries: ["URSS", "République Populaire de Chine (Mao)", "Yougoslavie", "RDA"],
                currCountries: ["Chine", "Cuba", "Viêt Nam", "Laos"]
            },
            { 
                party: "Démocratie Libérale", 
                leaders: ["Franklin D. Roosevelt", "Winston Churchill", "Charles de Gaulle", "John F. Kennedy", "Margaret Thatcher", "Ronald Reagan", "Konrad Adenauer", "Dwight Eisenhower"], 
                culture: "Libéralisme & Marché", symbol: "star", bgColors: ["#003399", "#ffffff", "#cc0000"],
                histCountries: ["République Romaine", "États-Unis (XXe s.)", "IVe République (France)"],
                currCountries: ["États-Unis", "France", "Allemagne", "Japon"]
            },
            { 
                party: "Monarchie Absolue", 
                leaders: ["Louis XIV", "Napoléon Ier", "Chaka Zoulou", "Alexandre le Grand", "Jules César", "Pierre le Grand", "Empereur Meiji", "Suleiman Ier"], 
                culture: "Tradition Impériale", symbol: "crown", bgColors: ["#4b0082", "#ffd700", "#ffffff"],
                histCountries: ["Empire Français", "Empire Russe", "Empire Ottoman", "Royaume de France"],
                currCountries: ["Arabie Saoudite", "Brunéi", "Oman", "Eswatini"]
            },
            { 
                party: "Social-Démocratie", 
                leaders: ["Olof Palme", "Clement Attlee", "Willy Brandt", "Jean Jaurès", "Léon Blum", "Sandro Pertini", "Michael Savage", "Nelson Mandela"], 
                culture: "État-Providence", symbol: "rose", bgColors: ["#e63946", "#ffffff", "#1d3557"],
                histCountries: ["Suède (Ère Palme)", "Royaume-Uni (Attlee)", "Autriche Rouge"],
                currCountries: ["Suède", "Norvège", "Danemark", "Finlande"]
            },
            { 
                party: "Théocratie", 
                leaders: ["Ruhollah Khomeini", "Innocent III", "Girolamo Savonarole", "Hong Xiuquan", "Umar ibn al-Khattâb", "Ismail Ier", "Jan van Leiden", "Pape Pie XII"], 
                culture: "Loi Sacrée", symbol: "cross", bgColors: ["#006633", "#ffffff", "#ffd700"],
                histCountries: ["États Pontificaux", "Califat Abbaside", "Florence de Savonarole"],
                currCountries: ["Iran", "Vatican", "Afghanistan (Talibans)"]
            },
            { 
                party: "Anarchisme", 
                leaders: ["Nestor Makhno", "Pierre-Joseph Proudhon", "Mikhail Bakounine", "Piotr Kropotkine", "Louise Michel", "Buenaventura Durruti", "Emma Goldman", "Errico Malatesta"], 
                culture: "Autogestion Libre", symbol: "anarchy", bgColors: ["#111111", "#cc0000", "#222222"],
                histCountries: ["Catalogne Anarchiste (1936)", "Territoire Libre de Makhno", "Commune de Paris"],
                currCountries: ["Rojava (Syrie du Nord)", "Zapatistes (Chiapas, Mexique)"]
            },
            { 
                party: "Écologisme", 
                leaders: ["René Dumont", "Petra Kelly", "Wangari Maathai", "Aldo Leopold", "Petra De Sutter", "Gro Harlem Brundtland", "E. F. Schumacher", "Chico Mendes"], 
                culture: "Éco-Responsabilité", symbol: "leaf", bgColors: ["#2a9d8f", "#e9c46a", "#264653"],
                histCountries: ["Nouvelle-Zélande (Politique Verde 1980)", "Communautés Écologiques Européennes"],
                currCountries: ["Costa Rica", "Bhoutan", "Islande"]
            }
        ];

        const steps = [
            { name: "Superficie", key: "area" },
            { name: "Population", key: "pop" },
            { name: "Taille de l'Armée", key: "armyRatio" },
            { name: "IDH", key: "hdi" },
            { name: "PIB / hab.", key: "gdpCap" },
            { name: "Parti Politique", key: "party" },
            { name: "Leader Historique", key: "leader" },
            { name: "Culture", key: "culture" },
            { name: "Nom du Pays & Drapeau", key: "final" }
        ];

        let currentStepIndex = 0;
        let isSpinning = false;
        let currentCountry = {};
        let currentWheelOptions = [];
        let tournamentNations = [];

        function getWheelOptionsForStep(stepKey) {
            let options = [];
            if (stepKey === "area") {
                for (let i = 1; i <= 8; i++) {
                    let val = (Math.floor(Math.random() * 9999) + 1) * 100000;
                    options.push({ text: val.toLocaleString('fr-FR') + " km²", value: val });
                }
            } else if (stepKey === "pop") {
                // Tirage parmi les 20 tranches de population
                let shufflePop = [...popCategories].sort(() => 0.5 - Math.random()).slice(0, 8);
                shufflePop.forEach(val => {
                    let txt = val >= 1000000000 ? (val/1000000000).toFixed(1) + " Mrd" : (val/1000000).toFixed(1) + " M";
                    if (val < 1000000) txt = (val/1000).toFixed(0) + " k";
                    options.push({ text: txt + " hab.", value: val });
                });
            } else if (stepKey === "armyRatio") {
                for (let i = 1; i <= 10; i++) {
                    options.push({ text: i + "% de la pop.", value: i });
                }
            } else if (stepKey === "hdi") {
                for (let i = 1; i <= 8; i++) {
                    let val = (0.100 + (Math.floor(Math.random() * 19) * 0.050)).toFixed(3);
                    options.push({ text: val, value: val });
                }
            } else if (stepKey === "gdpCap") {
                for (let i = 1; i <= 8; i++) {
                    let val = Math.floor(Math.random() * 1195) * 100 + 500;
                    options.push({ text: val.toLocaleString('fr-FR') + " $", value: val });
                }
            } else if (stepKey === "party") {
                politicalData.forEach(p => options.push({ text: p.party, value: p }));
            } else if (stepKey === "leader") {
                let partyObj = currentCountry.partyObj || politicalData[0];
                partyObj.leaders.forEach(l => options.push({ text: l, value: l }));
            } else if (stepKey === "culture") {
                politicalData.forEach(p => options.push({ text: p.culture, value: p.culture }));
            } else if (stepKey === "final") {
                for (let i = 1; i <= 8; i++) {
                    let name = prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)];
                    options.push({ text: name, value: name });
                }
            }
            return options;
        }

        function drawWheel(options) {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 200, 200);
            const slice = (Math.PI * 2) / options.length;
            const wheelColors = ["#e63946", "#457b9d", "#2a9d8f", "#e9c46a", "#f4a261", "#9b5de5", "#2cb67d", "#7f5af0"];

            for (let i = 0; i < options.length; i++) {
                ctx.beginPath();
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.moveTo(100, 100);
                ctx.arc(100, 100, 100, i * slice, (i + 1) * slice);
                ctx.fill();

                ctx.save();
                ctx.translate(100, 100);
                ctx.rotate(i * slice + slice / 2);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 9px sans-serif";
                ctx.fillText(options[i].text.substring(0, 14), 28, 3);
                ctx.restore();
            }
        }

        function updateStepWheel() {
            const step = steps[currentStepIndex];
            document.getElementById('wheelTitle').innerText = `Tourner pour : ${step.name}`;
            currentWheelOptions = getWheelOptionsForStep(step.key);
            drawWheel(currentWheelOptions);
        }

        function drawCustomFlag(partyObj) {
            const canvas = document.getElementById('flagCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!partyObj) {
                ctx.fillStyle = "#222"; ctx.fillRect(0, 0, canvas.width, canvas.height); return;
            }

            let colors = partyObj.bgColors;
            let w = canvas.width / 3;
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = colors[i];
                ctx.fillRect(i * w, 0, w, canvas.height);
            }

            let cx = canvas.width / 2, cy = canvas.height / 2;
            ctx.fillStyle = "#ffd700"; ctx.strokeStyle = "#111"; ctx.lineWidth = 3;

            if (partyObj.symbol === "fasces") {
                ctx.fillRect(cx - 5, cy - 35, 10, 70);
                ctx.beginPath(); ctx.arc(cx - 10, cy, 20, Math.PI * 1.5, Math.PI * 0.5); ctx.fill(); ctx.stroke();
            } else if (partyObj.symbol === "hammer_sickle") {
                ctx.font = "bold 50px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("☭", cx, cy);
            } else if (partyObj.symbol === "star") {
                ctx.font = "bold 60px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("★", cx, cy);
            } else if (partyObj.symbol === "crown") {
                ctx.font = "bold 50px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("👑", cx, cy);
            } else if (partyObj.symbol === "cross") {
                ctx.fillRect(cx - 8, cy - 35, 16, 70); ctx.fillRect(cx - 30, cy - 15, 60, 16);
            } else if (partyObj.symbol === "anarchy") {
                ctx.font = "bold 55px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Ⓐ", cx, cy);
            } else if (partyObj.symbol === "leaf") {
                ctx.font = "bold 50px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🌿", cx, cy);
            } else {
                ctx.font = "bold 50px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("🌹", cx, cy);
            }
        }

        // GENERATION LORE & COMPARAISONS POUR LE PAYS NORMAL
        function generateLoreAndComparison(c, simHist, simCurr) {
            let text = `<strong>Origine :</strong> Fondé sous la bannière du mouvement <em>${c.party}</em> sous la conduite de <strong>${c.leader}</strong>, le pays de <strong>${c.name}</strong> prône une culture centrée sur <em>${c.culture}</em>.<br><br>`;
            
            text += `<strong>Point commun avec ${simHist} (Historique) :</strong> Partage la même orientation idéologique (${c.party}) et une gestion centralisée du pouvoir autour de ${c.leader}.<br>`;
            text += `<strong>Différence avec ${simHist} :</strong> Une armée comptant ${c.armyRatio}% de la population (${c.armyCount.toLocaleString('fr-FR')} soldats) et un PIB/hab de ${c.gdpCap} $.<br><br>`;

            text += `<strong>Point commun avec ${simCurr} (Actuel) :</strong> Alignement stratégique et culturel fort autour de l'idéal de ${c.culture}.<br>`;
            text += `<strong>Différence avec ${simCurr} :</strong> Une population de ${c.pop.toLocaleString('fr-FR')} habitants pour un territoire de ${c.area.toLocaleString('fr-FR')} km².`;

            return text;
        }

        // GENERATION IA AVANTAGES / FAIBLESSES POUR TOURNOI
        function generateAIEvaluation(nation) {
            let pros = [], cons = [];

            if (nation.armyRatio >= 6) pros.push("Armée surpuissante et très mobilisée");
            else cons.push("Forces armées réduites");

            if (nation.gdpCap > 50000) pros.push("Économie extrêmement riche");
            else cons.push("Faible capital économique");

            if (parseFloat(nation.hdi) > 0.700) pros.push("Population très éduquée et développée");
            else cons.push("Retard de développement (IDH faible)");

            if (nation.pop > 100000000) pros.push("Réserves démographiques colossales");

            return `🟢 <strong>Avantages :</strong> ${pros.join(', ') || 'Équilibré'}<br>🔴 <strong>Faiblesses :</strong> ${cons.join(', ') || 'Aucune majeure'}`;
        }

        function spinNextStep() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('btnSpin').disabled = true;

            const step = steps[currentStepIndex];
            const wheel = document.getElementById('wheel');
            const selectedIndex = Math.floor(Math.random() * currentWheelOptions.length);
            const sliceDeg = 360 / currentWheelOptions.length;
            
            const targetDeg = 1440 + (360 - (selectedIndex * sliceDeg + sliceDeg/2));
            wheel.style.transform = `rotate(${targetDeg}deg)`;

            setTimeout(() => {
                const result = currentWheelOptions[selectedIndex];

                if (step.key === "area") {
                    currentCountry.area = result.value;
                    document.getElementById('c-area').innerText = result.text;
                } else if (step.key === "pop") {
                    currentCountry.pop = result.value;
                    document.getElementById('c-pop').innerText = result.text;
                } else if (step.key === "armyRatio") {
                    currentCountry.armyRatio = result.value;
                    if (currentCountry.pop) {
                        currentCountry.armyCount = Math.floor((currentCountry.pop * result.value) / 100);
                        document.getElementById('c-army').innerText = `${result.value}% (${currentCountry.armyCount.toLocaleString('fr-FR')} soldats)`;
                    } else {
                        document.getElementById('c-army').innerText = result.text;
                    }
                } else if (step.key === "hdi") {
                    currentCountry.hdi = result.value;
                    document.getElementById('c-hdi').innerText = result.text;
                } else if (step.key === "gdpCap") {
                    currentCountry.gdpCap = result.value;
                    document.getElementById('c-gdp-cap').innerText = result.text;

                    if (currentCountry.pop) {
                        let total = BigInt(currentCountry.pop) * BigInt(currentCountry.gdpCap);
                        document.getElementById('c-gdp-total').innerText = Number(total).toLocaleString('fr-FR') + " $";
                    }
                } else if (step.key === "party") {
                    currentCountry.partyObj = result.value;
                    currentCountry.party = result.value.party;
                    document.getElementById('c-party').innerText = result.text;
                } else if (step.key === "leader") {
                    currentCountry.leader = result.value;
                    document.getElementById('c-leader').innerText = result.text;
                } else if (step.key === "culture") {
                    currentCountry.culture = result.value;
                    document.getElementById('c-culture').innerText = result.text;
                } else if (step.key === "final") {
                    currentCountry.name = result.value;
                    document.getElementById('c-name').innerText = currentCountry.name;
                    drawCustomFlag(currentCountry.partyObj);

                    const pData = currentCountry.partyObj || politicalData[0];
                    const simHist = pData.histCountries[Math.floor(Math.random() * pData.histCountries.length)];
                    const simCurr = pData.currCountries[Math.floor(Math.random() * pData.currCountries.length)];

                    document.getElementById('c-sim-hist').innerText = simHist;
                    document.getElementById('c-sim-curr').innerText = simCurr;

                    // Affichage du Lore
                    document.getElementById('loreGroup').classList.remove('hidden');
                    document.getElementById('c-lore').innerHTML = generateLoreAndComparison(currentCountry, simHist, simCurr);
                }

                wheel.style.transition = 'none';
                wheel.style.transform = 'rotate(0deg)';
                setTimeout(() => { wheel.style.transition = 'transform 2.5s cubic-bezier(0.15, 0.99, 0.18, 1)'; }, 50);

                currentStepIndex = (currentStepIndex + 1) % steps.length;
                updateStepWheel();

                isSpinning = false;
                document.getElementById('btnSpin').disabled = false;
            }, 2500);
        }

        function generateAllWithWheelAnimation() {
            let i = 0;
            function autoSpin() {
                if (i < steps.length) {
                    spinNextStep();
                    i++;
                    setTimeout(autoSpin, 2800);
                }
            }
            autoSpin();
        }

        function switchMode(mode) {
            document.getElementById('btnModeNormal').classList.toggle('active', mode === 'normal');
            document.getElementById('btnModeTournament').classList.toggle('active', mode === 'tournament');
            document.getElementById('normalView').classList.toggle('hidden', mode !== 'normal');
            document.getElementById('tournamentView').classList.toggle('hidden', mode !== 'tournament');
        }

        // MODE TOURNOI
        function startTournamentGen() {
            tournamentNations = [];
            const container = document.getElementById('tournamentCountries');
            container.innerHTML = "";

            for (let i = 0; i < 5; i++) {
                const name = prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)];
                const partyObj = politicalData[Math.floor(Math.random() * politicalData.length)];
                const leader = partyObj.leaders[Math.floor(Math.random() * partyObj.leaders.length)];
                const area = (Math.floor(Math.random() * 9999) + 1) * 100000;
                const pop = popCategories[Math.floor(Math.random() * popCategories.length)];
                const armyRatio = Math.floor(Math.random() * 10) + 1;
                const armyCount = Math.floor((pop * armyRatio) / 100);
                const gdpCap = Math.floor(Math.random() * 1195) * 100 + 500;
                const hdi = (0.100 + (Math.floor(Math.random() * 19) * 0.050)).toFixed(3);
                const totalGdp = BigInt(pop) * BigInt(gdpCap);

                const nation = {
                    name, party: partyObj.party, leader, area, pop, armyRatio, armyCount, gdpCap, totalGdp, hdi,
                    power: Math.floor((area / 1000000) + (armyCount / 100000) + (gdpCap / 100) + (parseFloat(hdi) * 100))
                };
                tournamentNations.push(nation);

                const aiEval = generateAIEvaluation(nation);

                container.innerHTML += `
                    <div class="country-card">
                        <strong>${i+1}. ${nation.name}</strong> (${nation.party})<br>
                        <small>Leader: ${nation.leader} | Pop: ${nation.pop.toLocaleString('fr-FR')} | Armée: ${armyRatio}% (${armyCount.toLocaleString('fr-FR')} soldats)</small>
                        <div class="ai-analysis">
                            <strong>🤖 Analyse Stratégique IA :</strong><br>${aiEval}
                        </div>
                    </div>
                `;
            }
            document.getElementById('btnWar').classList.remove('hidden');
            document.getElementById('warLogs').classList.add('hidden');
        }

        function simulateWar() {
            const logBox = document.getElementById('warLogs');
            logBox.classList.remove('hidden');
            logBox.innerHTML = "> SIMULATION DE GUERRE DU TOURNOI ⚔️<br>";

            let fighters = [...tournamentNations];
            let round = 1;

            while (fighters.length > 1) {
                logBox.innerHTML += `<br>--- TOUR ${round} ---<br>`;
                let p1Index = Math.floor(Math.random() * fighters.length);
                let p2Index;
                do { p2Index = Math.floor(Math.random() * fighters.length); } while (p1Index === p2Index);

                let p1 = fighters[p1Index];
                let p2 = fighters[p2Index];

                let score1 = p1.power * (Math.random() + 0.5);
                let score2 = p2.power * (Math.random() + 0.5);

                if (score1 >= score2) {
                    logBox.innerHTML += `⚔️ ${p1.name} (${p1.armyCount.toLocaleString('fr-FR')} soldats) bat ${p2.name} !<br>`;
                    fighters.splice(p2Index, 1);
                } else {
                    logBox.innerHTML += `⚔️ ${p2.name} (${p2.armyCount.toLocaleString('fr-FR')} soldats) bat ${p1.name} !<br>`;
                    fighters.splice(p1Index, 1);
                }
                round++;
            }

            logBox.innerHTML += `<br>🏆 <strong>VAINQUEUR DU TOURNOI : ${fighters[0].name} (Leader: ${fighters[0].leader}) !</strong>`;
        }

        updateStepWheel();
        drawCustomFlag(null);
    </script>
</body>
</html>
