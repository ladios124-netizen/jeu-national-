<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Nation & Mode Tournoi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0d;
            color: #fffffe;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #16161a;
            border-radius: 16px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #242429;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: #242429;
            border: 1px solid #333;
            color: #94a1b2;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .mode-btn.active {
            background: #7f5af0;
            color: white;
            border-color: #7f5af0;
        }

        #flag {
            width: 100%;
            height: 180px;
            border-radius: 10px;
            display: flex;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .stripe-v { flex: 1; height: 100%; }
        .stripe-h { width: 100%; flex: 1; }

        canvas#mapCanvas {
            width: 100%;
            height: 160px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-group {
            background: #242429;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
        }

        .info-group.full { grid-column: span 2; }

        .label {
            font-size: 0.7rem;
            color: #94a1b2;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .value {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fffffe;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background-color: #7f5af0;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-auto {
            background-color: #2cb67d;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Sélection du Mode -->
        <div class="mode-selector">
            <button id="btnModeNormal" class="mode-btn active" onclick="switchMode('normal')">Mode Normal</button>
            <button id="btnModeTournament" class="mode-btn" onclick="switchMode('tournament')">Mode Tournoi 🏆</button>
        </div>

        <h1 id="titleDisplay">Générateur de Nation</h1>
        
        <!-- Drapeau -->
        <div id="flag"></div>

        <!-- Carte géographique -->
        <div class="label" style="text-align: left; margin-bottom: 4px;">Carte du Territoire</div>
        <canvas id="mapCanvas" width="400" height="160"></canvas>

        <!-- Statistiques -->
        <div class="grid-stats">
            <div class="info-group full">
                <div class="label">Nom du pays</div>
                <div class="value" id="country-name">-</div>
            </div>

            <div class="info-group">
                <div class="label">Superficie</div>
                <div class="value" id="area">-</div>
            </div>

            <div class="info-group">
                <div class="label">Population</div>
                <div class="value" id="population">-</div>
            </div>

            <div class="info-group full">
                <div class="label">Régime Politique</div>
                <div class="value" id="regime">-</div>
            </div>

            <div class="info-group">
                <div class="label">Capitale</div>
                <div class="value" id="capital">-</div>
            </div>

            <div class="info-group">
                <div class="label">Économie</div>
                <div class="value" id="economy">-</div>
            </div>
        </div>

        <!-- Actions Mode Normal -->
        <div id="normalActions" class="actions">
            <button class="btn-primary" onclick="generateNation()">Générer une Nation</button>
        </div>

        <!-- Actions Mode Tournoi -->
        <div id="tournamentActions" class="actions hidden">
            <button class="btn-primary" onclick="generateNation()">Générer le Pays (Manuel)</button>
            <button class="btn-auto" onclick="generateAutoNation()">⚡ Auto (Instant)</button>
        </div>
    </div>

    <script>
        const prefixes = ["Val", "Ar", "Bel", "Kael", "Nov", "Zor", "Ond", "Eld", "Mar", "Sol", "Vanguard", "Aethel"];
        const suffixes = ["ia", "is", "oria", "gard", "onia", "vane", "terra", "mire", "stan", "dor", "land"];
        const regimes = ["République Démocratique", "Empire Céleste", "Royaume Fédéral", "Technocratie", "Confédération", "Principauté"];
        const capitals = ["grad", "burg", "polis", "haven", "city", "spire", "reach"];
        const economies = ["Agricole", "Industrialisée", "Haute Technologie", "Minière", "Commerciale"];
        const colors = ["#e63946", "#f1faee", "#a8dadc", "#457b9d", "#1d3557", "#2a9d8f", "#e9c46a", "#f4a261", "#9b5de5"];

        let currentMode = 'normal';

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnModeNormal').classList.toggle('active', mode === 'normal');
            document.getElementById('btnModeTournament').classList.toggle('active', mode === 'tournament');
            
            document.getElementById('normalActions').classList.toggle('hidden', mode !== 'normal');
            document.getElementById('tournamentActions').classList.toggle('hidden', mode !== 'tournament');
            
            document.getElementById('titleDisplay').innerText = mode === 'normal' ? "Générateur de Nation" : "Mode Tournoi 🏆";
            generateNation();
        }

        function drawMap(areaKm) {
            const canvas = document.getElementById('mapCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Calcul du rayon de l'île sur la carte selon la superficie
            // De 10 m² à 10 000 000 km²
            let minArea = 10 / 1000000; // 10 m² en km²
            let maxArea = 10000000;
            
            let scale = Math.log10(areaKm + 1) / Math.log10(maxArea);
            let radius = Math.max(8, scale * 65);

            // Dessin de l'eau
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessin de l'île
            ctx.beginPath();
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;

            for (let a = 0; a < Math.PI * 2; a += 0.2) {
                let r = radius + (Math.sin(a * 4) * (radius * 0.2));
                let x = centerX + r * Math.cos(a);
                let y = centerY + r * Math.sin(a);
                if (a === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = '#22c55e';
            ctx.fill();
            ctx.strokeStyle = '#15803d';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Point Capitale
            ctx.beginPath();
            ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
        }

        function formatArea(area) {
            if (area < 1) {
                return (area * 1000000).toFixed(0) + " m²";
            }
            return area.toLocaleString('fr-FR') + " km²";
        }

        function generateNation() {
            const name = getRandomElement(prefixes) + getRandomElement(suffixes);
            document.getElementById("country-name").innerText = name;
            document.getElementById("regime").innerText = getRandomElement(regimes);
            document.getElementById("capital").innerText = getRandomElement(prefixes) + getRandomElement(capitals);
            document.getElementById("economy").innerText = getRandomElement(economies);

            // Superficie aléatoire de 10 m² à 10,000,000 km²
            let area;
            if (Math.random() < 0.2) {
                area = (Math.floor(Math.random() * 90) + 10) / 1000000; // Micro île (m²)
            } else {
                area = Math.floor(Math.random() * 9999000) + 1000; // Grand pays (km²)
            }

            document.getElementById("area").innerText = formatArea(area);

            // Population proportionnelle
            let pop = Math.floor(area * (Math.random() * 200 + 10));
            document.getElementById("population").innerText = pop.toLocaleString('fr-FR') + " hab.";

            // Dessin Drapeau
            const flag = document.getElementById("flag");
            flag.innerHTML = "";
            const isVertical = Math.random() > 0.5;
            flag.style.flexDirection = isVertical ? "row" : "column";

            for (let i = 0; i < 3; i++) {
                const stripe = document.createElement("div");
                stripe.className = isVertical ? "stripe-v" : "stripe-h";
                stripe.style.backgroundColor = getRandomElement(colors);
                flag.appendChild(stripe);
            }

            // Génération de la Carte
            drawMap(area);
        }

        function generateAutoNation() {
            generateNation();
            alert("⚡ Pays généré instantanément pour le tournoi !");
        }

        // Lancement initial
        generateNation();
    </script>
</body>
</html>
